<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="shield">
      <path d="M50 6 L86 18 V46 C86 70 70 86 50 94 C30 86 14 70 14 46 V18 Z"/>
    </clipPath>
  </defs>
  <!-- Shield body -->
  <path d="M50 6 L86 18 V46 C86 70 70 86 50 94 C30 86 14 70 14 46 V18 Z" fill="#143041"/>
  <!-- Inner blue panel -->
  <g clip-path="url(#shield)">
    <rect x="14" y="6" width="72" height="88" fill="#2c87a8"/>
  </g>
  <!-- Shield inner border -->
  <path d="M50 13 L80 23 V46 C80 66 66 80 50 87 C34 80 20 66 20 46 V23 Z"
        fill="none" stroke="#f3f9fb" stroke-width="2.5"/>
  <!-- Star of Life (6-spoke) -->
  <g transform="translate(50 50)" fill="#143041" stroke="#f3f9fb" stroke-width="2" stroke-linejoin="round">
    <g id="bar">
      <rect x="-6" y="-30" width="12" height="60" rx="3"/>
    </g>
    <use href="#bar" transform="rotate(60)"/>
    <use href="#bar" transform="rotate(120)"/>
  </g>
</svg>
